<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; script-src 'self'">
<title>가능충 케이크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="cake-side">
    <header class="brand">
      <h1>가능충 케이크</h1>
      <p>각자의 "이건 가능"을 막대에 꽂아 한 케이크에.</p>
    </header>

    <div class="fields">
      <label class="field">
        <span>케이크 이름</span>
        <input id="title" type="text" maxlength="30" placeholder="우리들의 가능 케이크">
      </label>
      <label class="field who">
        <span>지금 고르는 사람</span>
        <input id="who" type="text" maxlength="12" placeholder="이름 (비우면 이름표 없음)">
      </label>
    </div>

    <div class="stage" id="stage">
      <canvas id="cake" aria-label="케이크 미리보기"></canvas>
      <p class="empty" id="empty">오른쪽에서 검색하고<br>이미지의 <b>케이크에 꽂기</b>를 누르세요</p>
    </div>

    <div class="sel" id="sel" hidden>
      <div class="sel-row">
        <label class="mini">크기 <input id="selSize" type="range" min="70" max="320" step="1"></label>
        <label class="mini">막대 <input id="selLen" type="range" min="110" max="400" step="1"></label>
      </div>
      <div class="sel-row">
        <div class="seg" id="selShape" role="group" aria-label="모양">
          <button type="button" data-shape="card">사진</button>
          <button type="button" data-shape="circle">동그라미</button>
          <button type="button" data-shape="cutout">누끼</button>
        </div>
        <input id="selWho" class="selwho" type="text" maxlength="12" placeholder="이름표">
        <button type="button" class="btn ghost danger" id="selDel">뽑기</button>
      </div>
    </div>

    <footer class="actions">
      <label class="check"><input id="showNames" type="checkbox" checked> 이름표 보이기</label>
      <span class="count" id="count">0개</span>
      <button type="button" class="btn ghost" id="clearAll">다 비우기</button>
      <button type="button" class="btn ghost" id="copy">이미지 복사</button>
      <button type="button" class="btn primary" id="save">PNG 저장</button>
    </footer>
  </section>

  <section class="web-side">
    <div class="toolbar">
      <div class="navs">
        <button type="button" class="icon" id="back" title="뒤로" aria-label="뒤로"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <button type="button" class="icon" id="fwd" title="앞으로" aria-label="앞으로"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
        <button type="button" class="icon" id="reload" title="새로고침" aria-label="새로고침"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5"/></svg></button>
      </div>
      <form class="search" id="searchForm">
        <div class="seg engines" id="engines" role="group" aria-label="검색 엔진">
          <button type="button" data-engine="google" class="on">구글</button>
          <button type="button" data-engine="naver">네이버</button>
          <button type="button" data-engine="pinterest">핀터레스트</button>
          <button type="button" data-engine="namu">나무위키</button>
        </div>
        <input id="q" type="search" placeholder="고든 램지, 친구네 아빠, 그 캐릭터…" autocomplete="off">
        <button type="submit" class="btn primary">검색</button>
      </form>
    </div>
    <p class="hint">이미지에 마우스를 올리면 <b>케이크에 꽂기</b> 버튼이 떠요. 작은 썸네일은 한 번 눌러 크게 연 뒤 꽂으면 더 선명해요. 우클릭 메뉴로도 꽂을 수 있어요.</p>
    <webview id="web" partition="persist:browse" src="https://www.google.com/imghp?hl=ko"></webview>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="renderer.js"></script>
</body>
</html>
